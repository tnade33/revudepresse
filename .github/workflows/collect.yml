name: Collecte et publication de la revue de presse
on:
  schedule:
    # UTC : quatre collectes par jour, à la minute 17 pour éviter les heures pleines.
    - cron: '17 3,9,15,21 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'collector.py'
      - 'config/**'
      - 'data/curated.json'
      - '.github/workflows/collect.yml'

concurrency:
  group: revue-presse-publication
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Tests du collecteur
        run: python -m unittest discover -s tests -v
      - name: Collecter et générer les JSON
        run: python collector.py
      - name: Conserver les archives dans le dépôt
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/archive.json
          if ! git diff --cached --quiet; then
            git commit -m 'Actualisation des archives de presse [skip ci]'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier les données
        id: deployment
        uses: actions/deploy-pages@v4
